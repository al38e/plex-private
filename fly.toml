app = "plex-private"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 32400
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "plex_data"
  destination = "/config"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
