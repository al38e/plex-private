# fly.toml app configuration file generated for plex-private on 2026-11-05T20:29:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plex-private'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'plex_data'
  destination = '/config'

[http_service]
  internal_port = 32400
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
